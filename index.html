<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <title>Product card</title>
</head>
<body style="font-family: Montserrat;">
    <div class="all-elements background-picture">
        <h1 class="product-selection__title">Выбери свой продукт</h1>
            <div class="buttons">
                <button id="recolor-firs-card-button">Перекрасить фон первой карточки</button>
                <button id="recolor-all-card-button">Перекрасить фон всех карточек</button>
                <button id="open-google-button">Открыть Google </button>
                <button id="toggle-color-button">Переключить цвет кнопки </button>
            </div>
<div class="product-card-wrapper">
  <template id="product-template">
    <div class="product-card">
        <img class="product-card__image" src=""alt="">
        <p class="product-card__for-skin"></p>
        <h3 class="product-card__title"></h3>
        <p class="product-card__description"></p>
        <p class="product-card__composition"></p>
        <ul class="product-card__ingredients">
            <li></li>
            <li></li>
            <li></li>
        </ul>
        <div class="product-card__price-wrapper">
            <span class="product-card__price"></span>
            <span class="product-card__price-value">&#8381;</span>
        </div>
      </div>
  </template>
</div>
<script src="script.js"></script>
<script src="homework-5.js"></script>
<script src="homework-6.js"></script>
<script type="module" src="homework-7.js"></script>
<script type="module" src="homework-8.js"></script>
</body>
</html>
